name: CI

on:
  push:
    branches: [ main, master, feature-2 ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        working-directory: client
        run: npm install
      - name: Run tests
        working-directory: client
        run: npm test -- --run
        env:
          CI: true
