spring.application.name=hotel-management

# H2 Database Configuration (In-Memory - No Installation Needed)
spring.datasource.url=jdbc:h2:mem:hotel_management
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (Optional - Access at http://localhost:8080/api/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Logging Configuration
logging.level.root=INFO
logging.level.com.sivahotel=DEBUG
logging.level.org.springframework.web=DEBUG

# Server Configuration
server.port=8080
server.servlet.context-path=/api
